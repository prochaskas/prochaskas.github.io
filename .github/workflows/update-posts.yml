name: Update Substack posts

on:
  schedule:
    - cron: "17 13 * * *"   # every day at 13:17 UTC (early morning Pacific)
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab
  push:
    paths:
      - data/writing.json
      - scripts/fetch_substack.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch posts
        run: python scripts/fetch_substack.py
      - name: Commit if changed
        run: |
          if git diff --quiet data/posts.json; then
            echo "Nothing new."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/posts.json
            git commit -m "Update Substack posts"
            git push
          fi
